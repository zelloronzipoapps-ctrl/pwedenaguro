<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Rate Detector with OpenCV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hamburger" onclick="toggleMenu()">☰</div>
    <nav id="sideNav" class="side-nav">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">&times;</a>
        <a href="#" onclick="showSection('main')">🏠 Home</a>
        <a href="#" onclick="showSection('how-it-works')">❓ How It Works</a>
        <a href="#" onclick="showSection('about')">ℹ️ About Us</a>
        <button id="downloadAppBtn" class="install-btn" style="display:none;">📲 Install App</button>
    </nav>

    <header class="logo-header">
        <img src="finallogo.jpg" alt="Pulse Tracker Logo" class="main-logo">
    </header>

    <div class="container" id="mainApp">
        <p class="subtitle">Detect heart rate from your face using camera + OpenCV</p>
        
        <div class="video-container">
            <video id="video" autoplay playsinline style="display:none;"></video>
            <canvas id="output"></canvas>
        </div>
        
        <div class="pulse-display">
            <div id="skinToneLabel" style="font-size: 14px; opacity: 0.8; margin-bottom: 5px;">Detecting Skin Tone...</div>
            <div class="pulse-value" id="pulseValue">--</div>
            <div class="pulse-unit">BPM</div>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Status</span>
                <span id="status" class="stat-value">Waiting for OpenCV...</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Movement</span>
                <span id="motionStatus" class="stat-value">Stable</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Signal</span>
                <span id="signalQuality" class="stat-value">--</span>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="pulseChart"></canvas>
        </div>
        
        <div class="controls">
            <button id="startBtn" disabled>▶ Start Detection</button>
            <button id="stopBtn" style="display:none;">⏹ Stop</button>
            <button id="resetBtn" onclick="location.reload()">🔄 Reset</button>
        </div>
    </div>

    <div id="infoSection" class="overlay-section" style="display:none;">
        <button class="back-btn" onclick="showSection('main')">← Back</button>
        <h2 id="infoTitle" style="margin-top:20px;"></h2>
        <p id="infoContent" style="margin-top: 20px; line-height: 1.6; color: #333;"></p>
    </div>

    <!-- Correct Loading Order[cite: 1, 3] -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script async src="https://docs.opencv.org/4.5.x/opencv.js" type="text/javascript" onload="onOpenCvReady();"></script>
    <script src="script.js"></script>
</body>
</html>
